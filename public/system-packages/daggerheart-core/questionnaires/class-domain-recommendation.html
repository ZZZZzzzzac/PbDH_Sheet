const coreClassIds = {
  "吟游诗人 BARD":"职业:吟游诗人",
  "德鲁伊 DRUID":"职业:德鲁伊",
  "守护者 GUARDIAN":"职业:守护者",
  "游侠 RANGER":"职业:游侠",
  "游荡者 ROUGE":"职业:游荡者",
  "神使 SERAPH":"职业:神使",
  "术士 SORCERER":"职业:术士",
  "战士 WARRIOR":"职业:战士",
  "法师 WIZARD":"职业:法师"
};

const allDomains = Object.keys(domainDescriptions);

/* 渲染问卷 */
const form = document.getElementById('quizForm');
const answers = {};

function makeChoiceElement(q) {
  const fs = document.createElement('fieldset');
  const legend = document.createElement('legend');
  legend.textContent = q.id + '. ' + q.q;
  fs.appendChild(legend);

  const container = document.createElement('div');

  ['A','B'].forEach(choiceLetter => {
    const choiceData = (choiceLetter === 'A') ? q.a : q.b;
    const label = document.createElement('label');
    label.className = 'choice';
    label.tabIndex = 0;

    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'q' + q.id;
    input.value = choiceLetter;

    input.addEventListener('change', () => {
      answers[q.id] = choiceLetter;
      updateSelectionStyles(fs, q.id);
    });

    label.appendChild(input);

    const span = document.createElement('div');
    span.innerHTML = '<strong>' + choiceLetter + '.</strong> ' + choiceData.text;
    label.appendChild(span);

    label.addEventListener('click', (e) => {
      if(e.target.tagName.toLowerCase() !== 'input') {
        input.checked = true;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });

    container.appendChild(label);
  });

  fs.appendChild(container);
  return fs;
}

function updateSelectionStyles(fieldset, qid) {
  const labels = fieldset.querySelectorAll('label.choice');
  labels.forEach(label => {
    const input = label.querySelector('input');
    if(input && input.checked) label.classList.add('selected'); else label.classList.remove('selected');
  });
}

/* build form */
questions.forEach(q => {
  const el = makeChoiceElement(q);
  form.appendChild(el);
});

/* calculate logic */
function calculate() {
  const scores = {};
  allDomains.forEach(d => scores[d] = 0);

  questions.forEach(q => {
    const choice = answers[q.id];
    if(!choice) return;
    const picked = (choice === 'A') ? q.a : q.b;
    if(picked && picked.domains) {
      picked.domains.forEach(d => { scores[d] = (scores[d] || 0) + 1; });
    }
  });

  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({domain:k,score:v}));

  // 计算职业匹配度
  const classScores = {};
  Object.entries(classes).forEach(([className, classData]) => {
    let score = 0;
    classData.domains.forEach(domain => {
      score += scores[domain] || 0;
    });
    classScores[className] = score / classData.domains.length; // 计算平均分
  });

  // 排序职业
  const rankedClasses = Object.entries(classScores)
    .sort((a, b) => b[1] - a[1])
    .map(([name, score]) => ({ name, score, data: classes[name] }));

  return { scores, ranked, rankedClasses };
}

/* render result */
const resultArea = document.getElementById('resultArea');
function renderResult(res) {
  resultArea.innerHTML = '';
  if(!res) return;
  const top = res.ranked[0];
  const second = res.ranked[1];
  const third = res.ranked[2];
  const topClass = res.rankedClasses[0];
  const secondClass = res.rankedClasses[1];
  const thirdClass = res.rankedClasses[2];
  const applicableClass = res.rankedClasses.find(candidate => coreClassIds[candidate.name]);

  const wrap = document.createElement('div');
  wrap.className = 'result';

  const h2 = document.createElement('h2'); h2.textContent = '测验结果'; h2.style.marginTop='0';
  wrap.appendChild(h2);

  const best = document.createElement('div');
  best.innerHTML = '<h3>最适合你的领域：</h3><p style="font-size:20px;font-weight:700;margin:6px 0;color:var(--accent)">'+ (top ? top.domain : '—') +'</p><p style="opacity:0.9;">'+ (top ? domainDescriptions[top.domain] : '') +'</p>';
  wrap.appendChild(best);

  const others = document.createElement('div');
  others.innerHTML = '<h3 style="margin-top:12px">你也可以试着寻求其他力量：</h3>';
  const ul = document.createElement('ul');
  ul.style.marginTop='8px';
  if(second) {
    const li = document.createElement('li');
    li.innerHTML = '<strong>'+second.domain+'</strong> — ' + domainDescriptions[second.domain];
    ul.appendChild(li);
  }
  if(third) {
    const li2 = document.createElement('li');
    li2.innerHTML = '<strong>'+third.domain+'</strong> — ' + domainDescriptions[third.domain];
    ul.appendChild(li2);
  }
  others.appendChild(ul);
  wrap.appendChild(others);

  // 职业推荐部分
  const classRecommendation = document.createElement('div');
  classRecommendation.innerHTML = '<h3 style="margin-top:18px">职业推荐：</h3>';

  const classGrid = document.createElement('div');
  classGrid.className = 'grid';

  if(topClass) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.border = '1px solid rgba(99,102,241,0.5)';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <strong style="color:var(--accent)">${topClass.name}</strong>
        <span style="opacity:0.85">匹配度高</span>
      </div>
      <div style="margin-top:6px;color:rgba(255,255,255,0.85)">${topClass.data.description}</div>
    `;
    classGrid.appendChild(card);
  }

  if(secondClass) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <strong>${secondClass.name}</strong>
        <span style="opacity:0.85">匹配度较高</span>
      </div>
      <div style="margin-top:6px;color:rgba(255,255,255,0.85)">${secondClass.data.description}</div>
    `;
    classGrid.appendChild(card);
  }

  if(thirdClass) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <strong>${thirdClass.name}</strong>
        <span style="opacity:0.85">匹配度良好</span>
      </div>
      <div style="margin-top:6px;color:rgba(255,255,255,0.85)">${thirdClass.data.description}</div>
    `;
    classGrid.appendChild(card);
  }

  classRecommendation.appendChild(classGrid);
  if(applicableClass) {
    const applyButton = document.createElement('button');
    applyButton.className = 'btn primary';
    applyButton.type = 'button';
    applyButton.style.marginTop = '12px';
    applyButton.textContent = `将“${applicableClass.name}”填入人物卡`;
    applyButton.addEventListener('click',()=>{
      window.parent.postMessage({
        type:'pbdh-questionnaire-result',
        result:{
          protocolVersion:'1',
          interactions:[{
            type:'resourceSelected',
            sourceModuleId:'pick-class',
            libraryId:'classes',
            entryIds:[coreClassIds[applicableClass.name]]
          }]
        }
      },'*');
    });
    classRecommendation.appendChild(applyButton);
  }
  wrap.appendChild(classRecommendation);

  const allTitle = document.createElement('h3'); allTitle.textContent='完整得分：'; allTitle.style.marginTop='12px';
  wrap.appendChild(allTitle);

  const grid = document.createElement('div'); grid.className='grid';
  res.ranked.forEach(r => {
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline"><strong>'+r.domain+'</strong><span style="opacity:0.85">'+r.score+' 分</span></div><div style="margin-top:6px;color:rgba(255,255,255,0.85)">'+domainDescriptions[r.domain]+'</div>';
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  resultArea.appendChild(wrap);
}

/* button handlers */
document.getElementById('calcBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const res = calculate();
  renderResult(res);
  resultArea.scrollIntoView({behavior:'smooth'});
});

document.getElementById('resetBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const inputs = document.querySelectorAll('input[type=radio]');
  inputs.forEach(i=>{ i.checked = false; });
  for(const k in answers) delete answers[k];
  const labels = document.querySelectorAll('label.choice');
  labels.forEach(l=>l.classList.remove('selected'));
  resultArea.innerHTML = '';
  window.scrollTo({top:0,behavior:'smooth'});
});

document.querySelectorAll('label.choice').forEach(label=>{
  label.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' ') {
      const input = label.querySelector('input');
      if(input) {
        input.checked = true;
        input.dispatchEvent(new Event('change',{bubbles:true}));
      }
      e.preventDefault();
    }
  });
});

</script>
